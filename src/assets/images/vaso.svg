<svg width="300" height="350" viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="papelExterior" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="papelInterior" cx="50%" cy="20%" r="80%" fx="50%" fy="20%">
      <stop offset="40%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdbdbd;stop-opacity:1" />
    </radialGradient>

    <filter id="sombraBase" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    
    <ellipse cx="100" cy="245" rx="75" ry="15" fill="#000000" filter="url(#sombraBase)"/>

    <path d="M 10,60 L 35,230 Q 100,260 165,230 L 190,60 Q 100,20 10,60 Z" fill="url(#papelInterior)" stroke="none"/>
    
    <ellipse cx="100" cy="230" rx="65" ry="18" fill="#d4d4d4" stroke="#bababa" stroke-width="0.5"/>

    <path d="M 10,60 Q 100,105 190,60 L 165,230 Q 100,260 35,230 Z" fill="url(#papelExterior)" stroke="#d0d0d0" stroke-width="0.5"/>

    <path d="M 165,230 L 188,65" stroke="#cccccc" stroke-width="1" fill="none" opacity="0.6"/>

    <ellipse cx="100" cy="60" rx="90" ry="23" fill="none" stroke="#ffffff" stroke-width="5"/>
    <ellipse cx="100" cy="60" rx="90" ry="23" fill="none" stroke="#d9d9d9" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="100" cy="60" rx="86" ry="20" fill="none" stroke="#c0c0c0" stroke-width="1" opacity="0.5"/>
    
    <path d="M 35,230 Q 100,260 165,230" fill="none" stroke="#b0b0b0" stroke-width="2"/>

  </g>
</svg>